<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart To-Do</title>
<style>
:root{--pu:#6d4aff;--pu2:#5b3de0;--pl:#efeafe;--bg:#f5f4fb;--card:#fff;--tx:#1f1b3a;--mu:#7a7796;--bd:#e8e6f4;--rd:#e5484d;--am:#e8a317;--gr:#2f9e63}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:#fbfaff;border-right:1px solid var(--bd);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:12px;align-items:center;padding:0 8px 24px}
.lg{width:44px;height:44px;border-radius:12px;background:var(--pu);color:#fff;display:grid;place-items:center}
.lg svg{width:26px;height:26px;stroke-width:3}
.logo b{font-size:22px;color:var(--pu);display:block;line-height:1.1}
.logo small{font-size:11.5px;color:var(--mu)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:10px;color:#3d3a5c;text-align:left}
.nav:hover{background:var(--pl)}
.nav.on{background:var(--pl);color:var(--pu);font-weight:600}
.promo{margin-top:auto;background:var(--pl);border-radius:14px;padding:20px;text-align:center;color:var(--tx);font-size:14px}
.promo svg{width:42px;height:42px;color:var(--pu);margin-bottom:6px}
main{padding:0 28px 40px;min-width:0}
header{display:flex;align-items:center;gap:16px;padding:20px 0}
.sb{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 14px;color:var(--mu)}
.sb input{border:0;outline:0;background:none;flex:1;padding:12px 0;color:var(--tx)}
.sp{flex:1}
.undo{display:flex;gap:8px;align-items:center;color:var(--pu);font-weight:500;padding:8px 12px;border-radius:8px}
.undo:disabled{opacity:.4;cursor:default}
.user{display:flex;align-items:center;gap:10px;background:var(--pl);border-radius:30px;padding:4px 14px 4px 4px}
.av{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--pu);display:grid;place-items:center}
.cols{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px rgba(80,60,160,.04)}
.ch{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;margin-bottom:14px}
.ch .pl{width:38px;height:38px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center}
.ch.s{font-size:16px;gap:10px;color:var(--tx)}.ch.s svg{color:var(--pu)}
.in{width:100%;border:1px solid var(--bd);border-radius:10px;padding:13px 14px;background:#fff;outline:0}
.in:focus{border-color:var(--pu);box-shadow:0 0 0 3px var(--pl)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.add{background:var(--pu);color:#fff;padding:12px 30px;border-radius:10px;font-weight:600}
.add:hover{background:var(--pu2)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tabs{display:flex;background:var(--pl);border-radius:30px;padding:4px}
.tabs button{padding:8px 20px;border-radius:30px;color:#4b4770}
.tabs .on{background:var(--pu);color:#fff;font-weight:600}
.so{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mu);font-size:14px}
.so select{border:1px solid var(--bd);border-radius:8px;padding:7px 10px;background:#fff}
.task{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--bd)}
.task:last-child{border:0}
.task.d{background:#faf9ff}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--pu);cursor:pointer}
.info{flex:1;min-width:0}
.tt{font-weight:600;word-break:break-word}
.d .tt{text-decoration:line-through;color:#9a97b3;font-weight:500}
.id{font-size:11px;color:var(--mu);font-weight:400;margin-left:6px}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--mu);font-size:13.5px}
.meta svg{width:15px;height:15px}
.od{color:var(--rd)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:500}
.p1{background:#fdeaea;color:var(--rd)}.p2{background:#fdf0d0;color:#b87a00}.p3{background:#e0f5e9;color:var(--gr)}
.ib{padding:8px;border-radius:8px;color:#5d5a7c}.ib:hover{background:var(--pl);color:var(--pu)}
.empty{text-align:center;color:var(--mu);padding:34px 0}
.fl{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;color:#3d3a5c}
.fl:hover{background:var(--bg)}
.fl.on{background:var(--pl);color:var(--pu);font-weight:600}
.fl i{margin-left:auto;font-style:normal;background:var(--bg);border-radius:20px;min-width:34px;text-align:center;padding:3px 8px;font-size:13px;font-weight:600}
.fl.on i{background:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:12px;padding:16px 8px;text-align:center;font-size:14px}
.tile b{display:block;font-size:28px}
.t1{background:#ebe7ff;color:#3b2fa0}.t2{background:#fdf0d0;color:#9a6a00}.t3{background:#dff4e8;color:#1f7a49}.t4{background:#fde6e6;color:#c1272d}
.ds{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;margin-bottom:11px}
.ds u{width:11px;height:11px;border-radius:50%;margin-top:4px;flex-shrink:0}
.ds b{font-weight:600;display:block}
.ds span{color:var(--mu);font-size:12.5px}
.live{color:var(--pu)!important;font-weight:500}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{display:none}main{padding:0 14px 30px}.r2{grid-template-columns:1fr}.so{margin-left:0}.user span{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><div class="lg" id="lg"></div><div><b>Smart To-Do</b><small>Plan &bull; Organize &bull; Achieve</small></div></div>
    <nav id="nav"></nav>
    <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0;width:100%">
    <button class="nav" id="reset"></button>
    <div class="promo" id="promo"></div>
  </aside>
  <main>
    <header>
      <div class="sb"><span id="si"></span><input id="q" placeholder="Search tasks by name or #id..."></div>
      <div class="sp"></div>
      <button class="undo" id="undo"></button>
      <div class="user"><div class="av" id="av"></div><span>User</span></div>
    </header>
    <div class="cols">
      <div>
        <div class="card">
          <div class="ch"><div class="pl" id="plus"></div><span id="formTitle">Add New Task</span></div>
          <input class="in" id="title" placeholder="Task title..." maxlength="80">
          <div class="r2">
            <input class="in" id="due" type="date">
            <select class="in" id="pri"><option value="">Priority</option><option value="1">High</option><option value="2">Medium</option><option value="3">Low</option></select>
          </div>
          <button class="add" id="addBtn">Add Task</button>
        </div>
        <div class="card">
          <div class="bar">
            <div class="tabs" id="tabs"></div>
            <div class="so">Sort by:
              <select id="sortKey"><option value="pri">Priority</option><option value="due">Deadline</option><option value="name">Name</option></select>
              <button class="ib" id="dir"></button>
            </div>
          </div>
          <div id="tasks"></div>
        </div>
      </div>
      <div>
        <div class="card"><div class="ch s"><span id="fi"></span>Quick Filters</div><div id="filters"></div></div>
        <div class="card"><div class="ch s"><span id="si2"></span>Task Statistics</div><div class="tiles" id="stats"></div></div>
        <div class="card"><div class="ch s"><span id="ci"></span>Data Structures Used</div><div id="ds"></div></div>
      </div>
    </div>
  </main>
</div>
<script>
/* ============ DATA STRUCTURES (written from scratch) ============ */
class LNode{constructor(d){this.data=d;this.next=null}}
class LinkedList{                       // main storage, dynamic add/remove
  constructor(){this.head=null;this.size=0}
  add(d){const n=new LNode(d);if(!this.head)this.head=n;else{let c=this.head;while(c.next)c=c.next;c.next=n}this.size++}
  remove(id){let c=this.head,p=null;while(c){if(c.data.id===id){p?p.next=c.next:this.head=c.next;this.size--;return true}p=c;c=c.next}return false}
  clear(){this.head=null;this.size=0}
  toArray(){const a=[];let c=this.head;while(c){a.push(c.data);c=c.next}return a}
}
class Stack{constructor(){this.items=[]}push(x){this.items.push(x)}pop(){return this.items.pop()}get size(){return this.items.length}}   // undo (LIFO)
class Queue{constructor(){this.items=[]}enqueue(x){this.items.push(x)}dequeue(){return this.items.shift()}peek(){return this.items[0]}}  // task order (FIFO)
class MinHeap{                          // priority queue
  constructor(cmp){this.a=[];this.cmp=cmp}
  push(x){this.a.push(x);let i=this.a.length-1;while(i>0){const p=(i-1)>>1;if(this.cmp(this.a[i],this.a[p])<0){[this.a[i],this.a[p]]=[this.a[p],this.a[i]];i=p}else break}}
  pop(){if(!this.a.length)return;const t=this.a[0],l=this.a.pop();if(this.a.length){this.a[0]=l;let i=0;for(;;){let s=i,L=2*i+1,R=L+1;if(L<this.a.length&&this.cmp(this.a[L],this.a[s])<0)s=L;if(R<this.a.length&&this.cmp(this.a[R],this.a[s])<0)s=R;if(s===i)break;[this.a[i],this.a[s]]=[this.a[s],this.a[i]];i=s}}return t}
  peek(){return this.a[0]}
}
function mergeSort(arr,cmp){            // sorting, O(n log n)
  if(arr.length<2)return arr;
  const m=arr.length>>1,L=mergeSort(arr.slice(0,m),cmp),R=mergeSort(arr.slice(m),cmp),o=[];
  let i=0,j=0;while(i<L.length&&j<R.length)o.push(cmp(L[i],R[j])<=0?L[i++]:R[j++]);
  return o.concat(L.slice(i),R.slice(j));
}

/* ============ ICONS ============ */
const P={
 check:'<path d="M5 12l5 5 9-10"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',home:'<path d="M3 11l9-8 9 8v10H3z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',done:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',filter:'<path d="M3 4h18l-7 9v6l-4 2v-8z"/>',
 stats:'<path d="M5 21V10M12 21V4M19 21v-8"/>',code:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',note:'<rect x="4" y="3" width="14" height="18" rx="2"/><path d="M8 8h6M8 12h6M8 16h3"/>',
 up:'<path d="M12 19V5M5 12l7-7 7 7"/>',down:'<path d="M12 5v14M5 12l7 7 7-7"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ STATE ============ */
const list=new LinkedList(), undoStack=new Stack();
const PN={1:'High',2:'Medium',3:'Low'};
let nextId=1, view='all', sortKey='pri', asc=true, editing=null;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const fmt=s=>{if(!s)return'No deadline';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};

function save(){try{localStorage.setItem('smartTodo',JSON.stringify({t:list.toArray(),n:nextId}))}catch(e){}}
function load(){
  try{const s=JSON.parse(localStorage.getItem('smartTodo'));if(s&&s.t){s.t.forEach(t=>list.add(t));nextId=s.n;return}}catch(e){}
  seed();
}
function seed(){
  list.clear();nextId=1;
  [['Complete DS Mini Project Report',3,1,0],['Attend Class',-1,2,1],['Study Data Structures',2,1,0],['Build To-Do List Frontend',4,2,0],['Read DBMS Notes',6,3,0],['Workout',-2,3,1]]
   .forEach(([title,d,pri,done])=>list.add({id:nextId++,title,due:plus(d),pri,done:!!done}));
}
function snap(){undoStack.push(JSON.stringify(list.toArray()))}   // push state before every change
function doUndo(){
  if(!undoStack.size)return;
  list.clear();JSON.parse(undoStack.pop()).forEach(t=>list.add(t));save();render();
}
const find=id=>list.toArray().find(t=>t.id===id);

/* ============ ACTIONS ============ */
function submit(){
  const title=$('title').value.trim();if(!title){$('title').focus();return}
  const pri=Number($('pri').value)||2, due=$('due').value;
  snap();
  if(editing){const t=find(editing);t.title=title;t.pri=pri;t.due=due;editing=null}
  else list.add({id:nextId++,title,due,pri,done:false});
  $('title').value='';$('due').value='';$('pri').value='';
  $('addBtn').textContent='Add Task';$('formTitle').textContent='Add New Task';
  save();render();
}
function toggle(id){snap();const t=find(id);t.done=!t.done;save();render()}
function del(id){snap();list.remove(id);if(editing===id)editing=null;save();render()}
function edit(id){
  const t=find(id);editing=id;
  $('title').value=t.title;$('due').value=t.due;$('pri').value=t.pri;
  $('addBtn').textContent='Save Task';$('formTitle').textContent='Edit Task #'+id;
  window.scrollTo({top:0,behavior:'smooth'});$('title').focus();
}

/* ============ RENDER ============ */
const VIEWS={
  all:t=>true,pending:t=>!t.done,completed:t=>t.done,
  high:t=>t.pri===1,medium:t=>t.pri===2,low:t=>t.pri===3,
  today:t=>t.due===today()
};
function render(){
  const all=list.toArray();
  const cnt=k=>all.filter(VIEWS[k]).length;

  // sidebar nav
  const nav=[['all','Home','home'],['all','All Tasks','list'],['today','Today','cal'],['high','High Priority','alert'],['completed','Completed','done']];
  let used=false;
  $('nav').innerHTML=nav.map(([v,l,i],k)=>{const on=!used&&view===v&&(used=true);return`<button class="nav ${on?'on':''}" data-view="${v}">${ic(i)}${l}</button>`}).join('');

  // tabs
  $('tabs').innerHTML=[['all','All'],['pending','Pending'],['completed','Completed']].map(([v,l])=>`<button class="${view===v?'on':''}" data-view="${v}">${l}</button>`).join('');

  // filters
  const fl=[['all','All Tasks','list'],['pending','Pending','alert'],['completed','Completed','done'],['high','High Priority','alert'],['medium','Medium Priority','done'],['low','Low Priority','alert']];
  $('filters').innerHTML=fl.map(([v,l,i])=>`<button class="fl ${view===v?'on':''}" data-view="${v}">${ic(i)}${l}<i>${cnt(v)}</i></button>`).join('');

  // stats
  $('stats').innerHTML=[['t1',all.length,'Total Tasks'],['t2',cnt('pending'),'Pending'],['t3',cnt('completed'),'Completed'],['t4',cnt('high'),'High Priority']].map(([c,n,l])=>`<div class="tile ${c}"><b>${n}</b>${l}</div>`).join('');

  // search -> filter -> sort
  const q=$('q').value.trim().toLowerCase().replace(/^#/,'');
  let rows=all.filter(VIEWS[view]).filter(t=>!q||t.title.toLowerCase().includes(q)||String(t.id)===q);
  const cmps={pri:(a,b)=>a.pri-b.pri||(a.due||'9').localeCompare(b.due||'9'),due:(a,b)=>(a.due||'9').localeCompare(b.due||'9'),name:(a,b)=>a.title.localeCompare(b.title)};
  rows=mergeSort(rows,(a,b)=>asc?cmps[sortKey](a,b):cmps[sortKey](b,a));
  $('dir').innerHTML=ic(asc?'down':'up');

  $('tasks').innerHTML=rows.length?rows.map(t=>{
    const od=!t.done&&t.due&&t.due<today();
    return`<div class="task ${t.done?'d':''}">
      <input type="checkbox" data-chk="${t.id}" ${t.done?'checked':''}>
      <div class="info"><div class="tt">${esc(t.title)}<span class="id">#${t.id}</span></div>
      <div class="meta"><span class="${od?'od':''}" style="display:flex;align-items:center;gap:6px">${ic('cal')}${fmt(t.due)}</span><span class="pill p${t.pri}">${ic('flag')}${PN[t.pri]}</span></div></div>
      <button class="ib" data-edit="${t.id}" title="Edit">${ic('edit')}</button>
      <button class="ib" data-del="${t.id}" title="Delete">${ic('trash')}</button></div>`}).join(''):`<div class="empty">No tasks found. Add one above!</div>`;

  // live data structures (rebuilt from current data each render)
  const pending=all.filter(t=>!t.done);
  const queue=new Queue();pending.forEach(t=>queue.enqueue(t));
  const heap=new MinHeap(cmps.pri);pending.forEach(t=>heap.push(t));
  const hi=new MinHeap(cmps.pri);pending.filter(t=>t.pri===1).forEach(t=>hi.push(t));
  const nm=t=>t?esc(t.title.length>22?t.title.slice(0,21)+'…':t.title):'none';
  $('ds').innerHTML=[
    ['#4c9aff','Array / ArrayList','Store tasks',`${all.length} items in view array`],
    ['#b388ff','Linked List','Manage dynamic tasks',`size = ${list.size}, head = ${nm(list.head&&list.head.data)}`],
    ['#6fd49b','Queue','Task order',`front = ${nm(queue.peek())}`],
    ['#ffb84d','Stack','Undo operation',`${undoStack.size} undo steps stored`],
    ['#ef6b6b','Priority Queue / Heap','High priority tasks',`most urgent = ${nm(heap.peek())}`],
    ['#3bb3a8','Sorting','By priority / deadline',`Merge Sort O(n log n)`],
    ['#5b4ee8','Searching','Find task by name/ID',`${rows.length} match(es) now`]
  ].map(([c,n,d,l])=>`<div class="ds"><u style="background:${c}"></u><div><b>${n} <span>– ${d}</span></b><span class="live">${l}</span></div></div>`).join('');

  $('undo').disabled=!undoStack.size;
}

/* ============ INIT ============ */
$('lg').innerHTML=ic('check');$('plus').innerHTML=ic('plus');$('si').innerHTML=ic('search');
$('undo').innerHTML=ic('undo')+'Undo';$('av').innerHTML=ic('user');
$('reset').innerHTML=ic('gear')+'Reset demo data';$('promo').innerHTML=ic('note')+'<br>Small steps<br>make big progress!';
$('fi').innerHTML=ic('filter');$('si2').innerHTML=ic('stats');$('ci').innerHTML=ic('code');

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-view],[data-del],[data-edit]');if(!b)return;
  if(b.dataset.view){view=b.dataset.view;render()}
  else if(b.dataset.del)del(Number(b.dataset.del));
  else if(b.dataset.edit)edit(Number(b.dataset.edit));
});
document.addEventListener('change',e=>{if(e.target.dataset.chk)toggle(Number(e.target.dataset.chk))});
$('addBtn').onclick=submit;
$('title').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('q').addEventListener('input',render);
$('undo').onclick=doUndo;
$('sortKey').onchange=e=>{sortKey=e.target.value;render()};
$('dir').onclick=()=>{asc=!asc;render()};
$('reset').onclick=()=>{if(confirm('Reset all tasks to demo data?')){snap();seed();save();render()}};
load();render();
</script>
</body>
</html>
